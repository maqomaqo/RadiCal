# RadiCal Desktop and radical-server. See desktop/README.md for what each
# crate holds.
[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.2"
edition = "2024"
rust-version = "1.99"
license = "GPL-3.0-or-later"
repository = "https://github.com/maqomaqo/RadiCal"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.10"
sha1 = "0.10"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
# The ported numerics compare floats on purpose and cast between index and
# float types constantly; these two would be noise on every line of it.
float_cmp = "allow"
cast_precision_loss = "allow"

[profile.release]
# The solvers are the product; give the optimiser everything.
lto = "fat"
codegen-units = 1

[profile.dev.package.radical-core]
# The exact solvers multiply 2,000 x 2,000 matrices: unoptimised, one corpus
# case takes minutes rather than seconds. Debug assertions stay on.
opt-level = 3

[profile.dev.package."*"]
# Dependencies optimised even in debug builds, so `cargo test` on numeric code
# is not dominated by unoptimised serde_json parsing of the corpus.
opt-level = 3
