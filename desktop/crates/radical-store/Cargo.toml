[package]
name = "radical-store"
description = "RadiCal's database: the backend's tables in one SQLite file in the app-data folder, without the accounts."
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
serde_json.workspace = true
# SQLite compiled in, so the app needs nothing installed beside it.
rusqlite = { version = "0.40.2", features = ["bundled", "serde_json"] }
uuid = { version = "1.28.0", features = ["v4"] }

[dev-dependencies]
radical-corpus = { path = "../radical-corpus" }

[lints]
workspace = true
