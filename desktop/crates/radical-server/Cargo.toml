[package]
name = "radical-server"
description = "RadiCal's HTTP API, route for route the FastAPI backend's, over radical-store and radical-jobs."
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
axum = "0.8.9"
base64 = "0.23.1"
bcrypt = "0.19.3"
getrandom = "0.3.4"
hmac = "0.12.1"
lettre = { version = "0.11.23", default-features = false, features = ["builder", "hostname", "smtp-transport", "rustls", "ring", "rustls-native-certs"] }
miniz_oxide = "0.8"
postgres = "0.19.14"
radical-core = { path = "../radical-core" }
radical-io = { path = "../radical-io" }
radical-jobs = { path = "../radical-jobs" }
radical-store = { path = "../radical-store" }
rpassword = "7.5.4"
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sha2.workspace = true
tokio = { version = "1.54.0", features = ["rt-multi-thread", "macros", "net", "signal", "time", "fs"] }
ureq = { version = "2", default-features = false }

[lints]
workspace = true

[dev-dependencies]
http-body-util = "0.1.5"
radical-corpus = { path = "../radical-corpus" }
regex = "1.13.1"
tokio = { version = "1.54.0", features = ["rt-multi-thread", "macros", "time"] }
tower = { version = "0.5.3", features = ["util"] }
