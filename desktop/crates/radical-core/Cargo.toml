[package]
name = "radical-core"
description = "The calibration maths and exact solvers of RadiCal, ported from backend/app/services: no I/O, no async."
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
# The curve content hash (curve_registry), as hashlib.sha256 computes it.
sha2.workspace = true
# The exact solver's evidence keys a model's readings as hashlib.sha1 does.
sha1.workspace = true

# The exact solvers' matrix products (matrix::Matrix::matmul): Accelerate on
# macOS, faer everywhere else.
[target.'cfg(target_os = "macos")'.dependencies]
radical-accelerate = { path = "../radical-accelerate" }

[target.'cfg(not(target_os = "macos"))'.dependencies]
faer.workspace = true

[dev-dependencies]
radical-corpus = { path = "../radical-corpus" }
serde_json.workspace = true

[lints]
workspace = true
