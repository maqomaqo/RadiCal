# The Rust workspace for RadiCal Desktop (desktop/README.md), on the three
# platforms it ships for. The toolchain comes from
# desktop/rust-toolchain.toml, which rustup on the runner installs.
name: Desktop

on:
  push:
    paths: ['desktop/**', 'calibration_data/**', '.github/workflows/desktop.yml']
  pull_request:
    paths: ['desktop/**', 'calibration_data/**', '.github/workflows/desktop.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cargo:
    name: cargo (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    # Windows takes the longest: about 27 minutes before the desktop app's
    # webview crates joined the build, over 30 since.
    timeout-minutes: 45
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop
      # radical-desktop builds on the system webview; Linux has to be given
      # WebKitGTK's headers (macOS and Windows ship theirs).
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --all-targets --locked
