# Builds RadiCal Desktop's installers (docs/RUST_DESKTOP_PLAN.md, Phase 8):
# a universal .dmg for macOS, .msi and setup .exe for Windows, and .AppImage
# and .deb for Linux. A tag desktop-v1.2.3 also puts them on a draft GitHub
# release for that version, to be checked and published by hand; a manual
# run only keeps them as this run's artifacts.
#
# Signing is used when its secrets are set, and skipped when they are not:
# the installers then work, but macOS and Windows warn before opening them.
# See docs/INSTALLATION.md for what each platform shows.
#
# Updates: with the TAURI_SIGNING_PRIVATE_KEY secret set, each platform's
# update is signed, and the release carries a latest.json naming them, which
# installed copies read (tauri.conf.json, plugins.updater). A tag is refused
# without the key, since its release would offer no updates.
name: Desktop release

on:
  push:
    tags: ['desktop-v*']
    # A change to this file, on any branch, builds the installers too without
    # releasing them, so a broken release is found before a tag needs it.
    # (GitHub does not read `paths` for a tag push, so a tag always builds.)
    branches: ['**']
    paths: ['.github/workflows/desktop-release.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bundle:
    name: bundle (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
            args: --target universal-apple-darwin --bundles app,dmg
            out: |
              desktop/target/universal-apple-darwin/release/bundle/dmg/*.dmg
              desktop/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz
              desktop/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz.sig
          - name: Windows
            os: windows-latest
            args: --bundles msi,nsis
            out: |
              desktop/target/release/bundle/msi/*.msi
              desktop/target/release/bundle/nsis/*.exe
              desktop/target/release/bundle/nsis/*.exe.sig
          # The oldest Linux it is built on is the oldest it runs on: 22.04
          # is the oldest with the WebKitGTK the webview needs.
          - name: Linux
            os: ubuntu-22.04
            args: --bundles appimage,deb
            out: |
              desktop/target/release/bundle/appimage/*.AppImage
              desktop/target/release/bundle/appimage/*.AppImage.sig
              desktop/target/release/bundle/deb/*.deb
    # A release build optimises the whole program at once, and the macOS
    # one does it twice, once per architecture.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7

      - name: The tag names the version being built
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          tagged="${GITHUB_REF_NAME#desktop-v}"
          built=$(python3 -c "import json; print(json.load(open('desktop/crates/radical-desktop/tauri.conf.json'))['version'])")
          if [ "$tagged" != "$built" ]; then
            echo "::error::Tag says $tagged but tauri.conf.json says $built"
            exit 1
          fi

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build the frontend the app carries
        working-directory: frontend
        run: |
          npm ci
          npm run build

      # In desktop/, so rustup adds them to the toolchain rust-toolchain.toml
      # pins rather than to the runner's default.
      - if: runner.os == 'macOS'
        working-directory: desktop
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop

      # Only the secrets that are set reach the build: Tauri takes an empty
      # APPLE_CERTIFICATE as a certificate to import, and fails on it.
      - name: Signing, when its secrets are set
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY \
                      APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID TAURI_SIGNING_PRIVATE_KEY; do
            if [ -n "${!name}" ]; then
              { echo "$name<<END_OF_VALUE"; echo "${!name}"; echo "END_OF_VALUE"; } >> "$GITHUB_ENV"
            fi
          done

      - name: Build and bundle
        working-directory: desktop/crates/radical-desktop
        shell: bash
        run: |
          updates=()
          if [ -z "${TAURI_SIGNING_PRIVATE_KEY:-}" ]; then
            if [[ "$GITHUB_REF" == refs/tags/* ]]; then
              echo "::error::TAURI_SIGNING_PRIVATE_KEY is not set, so this release could not update itself"
              exit 1
            fi
            echo "::warning::TAURI_SIGNING_PRIVATE_KEY is not set: building without update files"
            updates=(--config '{"bundle":{"createUpdaterArtifacts":false}}')
          fi
          # The key was made without a password.
          export TAURI_SIGNING_PRIVATE_KEY_PASSWORD=""
          npx --yes @tauri-apps/cli@2.12.4 build --config tauri.release.conf.json "${updates[@]}" ${{ matrix.args }}

      - uses: actions/upload-artifact@v7
        with:
          name: RadiCal-${{ matrix.name }}
          path: ${{ matrix.out }}
          if-no-files-found: error

  release:
    needs: bundle
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: installers
          merge-multiple: true
      # What installed copies read to learn of this version: each platform's
      # update, by its address on this release, with its signature.
      - name: Write latest.json
        shell: python
        run: |
          import datetime, glob, json, os
          tag = os.environ["GITHUB_REF_NAME"]
          base = f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/releases/download/{tag}"
          def entry(pattern):
              [path] = glob.glob(f"installers/{pattern}")
              with open(path + ".sig") as sig:
                  signature = sig.read().strip()
              return {"signature": signature, "url": f"{base}/{os.path.basename(path)}"}
          mac = entry("*.app.tar.gz")
          manifest = {
              "version": tag.removeprefix("desktop-v"),
              "notes": f"See {base.replace('/download/', '/tag/')}",
              "pub_date": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "platforms": {
                  "darwin-aarch64": mac,
                  "darwin-x86_64": mac,
                  "windows-x86_64": entry("*-setup.exe"),
                  "linux-x86_64": entry("*.AppImage"),
              },
          }
          with open("installers/latest.json", "w") as out:
              json.dump(manifest, out, indent=2)
          # The signatures are in latest.json; the release needs no copies.
          for sig in glob.glob("installers/*.sig"):
              os.remove(sig)
      - uses: softprops/action-gh-release@v3
        with:
          draft: true
          name: RadiCal Desktop ${{ github.ref_name }}
          files: installers/*
