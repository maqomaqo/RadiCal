# Alembic configuration.
#
# `sqlalchemy.url` is deliberately absent: the URL comes from DATABASE_URL via
# alembic/env.py, so there is exactly one place that decides which database
# this app talks to (app/database.py) and no second copy here to drift from
# it or to be committed with someone's password in it.

[alembic]
script_location = alembic
prepend_sys_path = .
# Revision files are named <timestamp>_<slug>.py so that `ls versions/` reads
# in the order the migrations were written. The revision id inside is still
# what Alembic orders by; this is for the human.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(slug)s
timezone = UTC

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
