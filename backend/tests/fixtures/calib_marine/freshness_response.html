<script type='text/javascript'>
var map;
   var myLatLng = new google.maps.LatLng(0,0);
   var myOptions =
   {
      mapTypeId: google.maps.MapTypeId.HYBRID,
      center: myLatLng,
      zoom: 1
   };
   map = new google.maps.Map(document.getElementById('map_canvas'), myOptions);
   google.maps.event.addListener(map, 'click',
   function(event)
   {
      var mylatlon = event.latLng;
      var mylat = mylatlon.lat();
      var mylon = mylatlon.lng();
      document.mymap.clat.value = mylat;
      document.mymap.clon.value = mylon;
      var marker = new google.maps.Marker({
         position: mylatlon,
         title: String(event.latLng),
         map: map,
         icon: 'mm_20_green.png'
      });
      google.maps.event.addListener(marker, 'click',
      function()
      {
      });
   });
var gbounds = new google.maps.LatLngBounds();
point = new google.maps.LatLng(0.00072916666666667,0.00010416666666667);

position: point,
map: map,
icon: 'mm_20_yellow.png',

});
