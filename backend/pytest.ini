[pytest]
markers =
    slow: a test that costs minutes rather than seconds, and is worth it.
        Currently only tests/test_dispersal_coverage.py, which simulates whole
        fronts through calibration and a solver to ask whether a reported 95%
        interval contains the truth 95% of the time. Registered rather than
        deselected by default: a coverage test that never runs is a coverage
        test nobody can rely on, so it runs with everything else and its size
        is tuned by RADICAL_COVERAGE_FRONTS instead.
