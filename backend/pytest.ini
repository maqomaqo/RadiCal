[pytest]
markers =
    slow: a test that takes five seconds or more -- almost always because
        it runs a solver to convergence, often against an OxCal fixture.
        Plain `pytest` runs them with everything else. CI's per-push tier
        runs `pytest -m "not slow"` (6 minutes locally, against 16), and the
        whole suite runs on main and nightly (.github/workflows/tests.yml),
        so a slow test is moved out of the way of a review, never skipped.
        Mark a new test slow when `pytest --durations=0` puts it at 5s+.
