# The development stack: RadiCal's server (radical-server, built from
# desktop/) on :8000, and the frontend's dev server on :5173, which
# hot-reloads and forwards /api to the server. Open http://localhost:5173.
#
#   docker compose up -d                    start it
#   docker compose up -d --build server     after a change to the Rust code
#
# The server keeps its data in one SQLite file on the `data` volume, as the
# published image does (docker-compose.prod.yml), but with RADICAL_ENV
# defaulting to development.

services:
  server:
    build:
      context: .
      target: runtime
    container_name: radical_server
    ports:
      - "8000:8000"
    environment:
      # Passed through rather than defaulted. An empty RADICAL_SECRET_KEY is
      # what makes the server fall back to its development key and say so;
      # giving it a default here would put a real-looking key in version
      # control, which is the one thing a signing key must never be.
      RADICAL_ENV: ${RADICAL_ENV:-development}
      RADICAL_SECRET_KEY: ${RADICAL_SECRET_KEY:-}
      # Optional password-reset emails; see .env.example.
      RADICAL_PUBLIC_URL: ${RADICAL_PUBLIC_URL:-}
      RADICAL_SMTP_HOST: ${RADICAL_SMTP_HOST:-}
      RADICAL_SMTP_PORT: ${RADICAL_SMTP_PORT:-}
      RADICAL_SMTP_SECURITY: ${RADICAL_SMTP_SECURITY:-}
      RADICAL_SMTP_USER: ${RADICAL_SMTP_USER:-}
      RADICAL_SMTP_PASSWORD: ${RADICAL_SMTP_PASSWORD:-}
      RADICAL_SMTP_FROM: ${RADICAL_SMTP_FROM:-}
    volumes:
      - data:/data
    command: ["--accounts", "--host", "0.0.0.0", "--port", "8000"]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: radiocarbon_frontend
    ports:
      - "5173:5173"
    environment:
      # Where the dev server forwards /api: the server service, by name.
      API_PROXY_TARGET: http://server:8000
      # Set to true in .env when the checkout is on a Windows drive: Docker
      # Desktop passes no file-change events from it into the container, and
      # without polling the dev server never sees an edit.
      CHOKIDAR_USEPOLLING: ${CHOKIDAR_USEPOLLING:-false}
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev -- --host

volumes:
  data:

networks:
  default:
    name: radiocarbon_network
