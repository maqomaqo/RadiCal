services:
  postgres:
    image: postgres:15-alpine
    container_name: radiocarbon_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-radiocarbon}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-radiocarbon_db}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-radiocarbon} -d ${POSTGRES_DB:-radiocarbon_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        # This stack bind-mounts the source and runs --reload: it is the
        # development backend, and `docker exec radiocarbon_backend pytest`
        # should just work in it.
        INSTALL_DEV: "true"
    container_name: radiocarbon_backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-radiocarbon}:${POSTGRES_PASSWORD:-password}@postgres:5432/${POSTGRES_DB:-radiocarbon_db}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      # Passed through rather than defaulted. An empty RADICAL_SECRET_KEY is
      # what makes the app fall back to its development key and say so; giving
      # it a default here would put a real-looking key in version control,
      # which is the one thing a signing key must never be.
      RADICAL_ENV: ${RADICAL_ENV:-development}
      RADICAL_SECRET_KEY: ${RADICAL_SECRET_KEY:-}
      INTCAL_CURVE_PATH: ${INTCAL_CURVE_PATH:-/app/data/intcal20.14c}
      MARINE_CURVE_PATH: ${MARINE_CURVE_PATH:-/app/data/marine20.14c}
      SHCAL_CURVE_PATH: ${SHCAL_CURVE_PATH:-/app/data/shcal20.14c}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - ./calibration_data:/app/data
      - ./uploads:/app/uploads
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: radiocarbon_frontend
    ports:
      - "5173:5173"
    environment:
      # Where the dev server forwards /api: the backend service, by name.
      API_PROXY_TARGET: http://backend:8000
      # Set to true in .env when the checkout is on a Windows drive: Docker
      # Desktop passes no file-change events from it into the container, and
      # without polling the dev server never sees an edit.
      CHOKIDAR_USEPOLLING: ${CHOKIDAR_USEPOLLING:-false}
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev -- --host

volumes:
  postgres_data:

networks:
  default:
    name: radiocarbon_network
